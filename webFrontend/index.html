<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app_logo.png" />
    <link rel="apple-touch-icon" href="/app_logo.png" />
    <meta name="theme-color" content="#0d1b2a" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EasyPay | Home</title>
    <style>
      #app-starter-loader {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        margin: 0;
        background: #f8fafc;
      }
      #app-starter-loader .starter-logo {
        width: 56px;
        height: 56px;
        object-fit: contain;
        border-radius: 12px;
        box-shadow: 0 1px 3px rgb(15 23 42 / 0.08);
      }
      #app-starter-loader .starter-spinner {
        width: 28px;
        height: 28px;
        border: 3px solid #e2e8f0;
        border-top-color: #475569;
        border-radius: 50%;
        animation: starter-spin 0.75s linear infinite;
      }
      @keyframes starter-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-starter-loader .starter-spinner {
          animation: none;
          border-color: #cbd5e1;
          opacity: 0.85;
        }
      }
    </style>
  </head>
  <body>
    <div
      id="app-starter-loader"
      role="status"
      aria-live="polite"
      aria-label="Loading application"
    >
      <img
        class="starter-logo"
        src="/app_logo.png"
        alt=""
        width="56"
        height="56"
        decoding="async"
      />
      <div class="starter-spinner" aria-hidden="true"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
